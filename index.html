<!DOCTYPE html>
<html>
<head>
    <title>KAMAKSHI SHOP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 🔥 Firebase v8 SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f8;
        }

        /* ===== HEADER ===== */
        .header {
            background: #2e7d32;
            color: white;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            text-align: center;
            font-size: 26px;
            letter-spacing: 1px;
        }

        .header-right {
            text-align: right;
        }

        .header button {
            background: white;
            color: #2e7d32;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 650px;
            margin: auto;
            padding: 15px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            margin-bottom: 15px;
        }

        h2 {
            text-align: center;
            color: #2e7d32;
            margin-top: 0;
        }

        /* ===== ITEMS ===== */
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        .item span {
            font-weight: 600;
        }

        .item input {
            width: 150px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        /* ===== BUTTONS ===== */
        .main-btn {
            width: 100%;
            background: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .remove-btn {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* ===== PAGES ===== */
        .page { display: none; }
        .active { display: block; }

        /* ===== MOBILE ===== */
        @media (max-width: 480px) {
            .header {
                grid-template-columns: 1fr;
                row-gap: 10px;
                text-align: center;
            }

            .header-right {
                text-align: center;
            }

            .header h1 {
                font-size: 22px;
            }

            .item {
                flex-direction: column;
                align-items: flex-start;
            }

            .item input {
                width: 100%;
                margin-top: 5px;
            }
        }
    </style>
</head>

<body>

<!-- ===== HEADER ===== -->
<div class="header">
    <div></div>
    <h1>KAMAKSHI SHOP</h1>
    <div class="header-right">
        <button id="topActionBtn" onclick="topAction()">Admin Login</button>
    </div>
</div>

<div class="container">

    <!-- 🧑 CUSTOMER PAGE -->
    <div id="customerPage" class="page active card">
        <h2>Place Your Order</h2>
        <div id="itemsContainer"></div>
        <button class="main-btn" onclick="sendOrder()">Send Order on WhatsApp</button>
    </div>

    <!-- 🔐 LOGIN PAGE -->
    <div id="loginPage" class="page card">
        <h2>Admin Login</h2>
        <input type="text" id="username" placeholder="Username"><br><br>
        <input type="password" id="password" placeholder="Password"><br><br>
        <button class="main-btn" onclick="adminLogin()">Login</button>
    </div>

    <!-- 👩‍💼 ADMIN PAGE -->
    <div id="adminPage" class="page card">
        <h2>Admin Panel</h2>
        <input type="text" id="newItemName" placeholder="Product Name (Eg: Sugar)">
        <button class="main-btn" onclick="addItem()">Add Product</button>
        <br><br>
        <div id="adminItems"></div>
    </div>

</div>

<script>
/* ===== FIREBASE CONFIG ===== */
var firebaseConfig = {
  apiKey: "AIzaSyB3yxJAu3r5scIqBr1xZTXbEVhlxcEZyTg",
  authDomain: "kamakshi-shop.firebaseapp.com",
  databaseURL: "https://kamakshi-shop-default-rtdb.firebaseio.com",
  projectId: "kamakshi-shop",
  storageBucket: "kamakshi-shop.appspot.com",
  messagingSenderId: "298004586089",
  appId: "1:298004586089:web:4eddd6671ad362eb900cf8"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

/* ===== GLOBALS ===== */
let items = [];
let isAdmin = false;

/* ===== PAGE SWITCH ===== */
function showPage(id) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function topAction() {
    if (isAdmin) logout();
    else showPage("loginPage");
}

/* ===== LOGIN ===== */
function adminLogin() {
    let u = document.getElementById("username").value;
    let p = document.getElementById("password").value;

    if (u === "Karuna" && p === "12345678") {
        isAdmin = true;
        document.getElementById("topActionBtn").innerText = "Logout";
        showPage("adminPage");
        renderAdmin();
    } else {
        alert("Invalid Credentials");
    }
}

function logout() {
    isAdmin = false;
    document.getElementById("topActionBtn").innerText = "Admin Login";
    showPage("customerPage");
}

/* ===== FIREBASE LOAD (REAL-TIME) ===== */
db.ref("items").on("value", snapshot => {
    items = snapshot.val() || ["Sugar"];
    renderCustomer();
    if (isAdmin) renderAdmin();
});

/* ===== RENDER ===== */
function renderCustomer() {
    let c = document.getElementById("itemsContainer");
    c.innerHTML = "";
    items.forEach((item, i) => {
        c.innerHTML += `
            <div class="item">
                <span>${i + 1}. ${item}</span>
                <input type="text" id="qty-${i}" placeholder="Qty (eg: 1 kg / 2 L)">
            </div>`;
    });
}

function renderAdmin() {
    let a = document.getElementById("adminItems");
    a.innerHTML = "";
    items.forEach((item, i) => {
        a.innerHTML += `
            <div class="item">
                <span>${i + 1}. ${item}</span>
                <button class="remove-btn" onclick="removeItem(${i})">Remove</button>
            </div>`;
    });
}

/* ===== ADMIN ACTIONS ===== */
function addItem() {
    let name = document.getElementById("newItemName").value.trim();
    if (!name) return alert("Enter product name");

    items.push(name);
    db.ref("items").set(items);
    document.getElementById("newItemName").value = "";
}

function removeItem(i) {
    items.splice(i, 1);
    db.ref("items").set(items);
}

/* ===== SEND ORDER ===== */
function sendOrder() {
    let msg = "Hello, I want to order from KAMAKSHI SHOP:\n\n";
    let ok = false;

    items.forEach((item, i) => {
        let q = document.getElementById(`qty-${i}`).value;
        if (q) {
            msg += `${i + 1}. ${item} - ${q}\n`;
            ok = true;
        }
    });

    if (!ok) return alert("Please enter at least one item");

    let phone = "919790198479";
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");
}
</script>

</body>
</html>
