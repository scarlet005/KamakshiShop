

<!DOCTYPE html>
<html>
<head>
    <title>Shop Order Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: auto;
        }
        h2 { text-align: center; }
        .item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
        }
        input {
            width: 140px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
        }
        .admin-panel {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 15px;
            display: none;
        }
        .remove-btn {
            margin-left: 5px;
            background-color: red;
            color: white;
            border: none;
            padding: 4px 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>Shop Order</h2>

<!-- 🔐 ADMIN LOGIN -->
<div id="loginBox">
    <h3>Admin Login</h3>
    <input type="text" id="username" placeholder="Username"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>
    <button onclick="adminLogin()">Login</button>
</div>

<!-- 👩‍💼 ADMIN PANEL -->
<div class="admin-panel" id="adminPanel">
    <h3>Admin Panel</h3>
    <input type="text" id="newItemName" placeholder="Item Name (Eg: Oil)">
    <input type="text" id="newItemPrice" placeholder="Price (Eg: ₹180/L)">
    <button onclick="addItem()">Add Item</button>
</div>

<!-- 🧺 ITEMS LIST -->
<div id="itemsContainer"></div>

<button onclick="sendOrder()">Send Order on WhatsApp</button>

<script>
let items = [
    { name: "Sugar", price: "₹45/kg" },
    { name: "Rice", price: "₹60/kg" },
    { name: "Milk", price: "₹28/500ml" }
];

function renderItems(isAdmin = false) {
    let container = document.getElementById("itemsContainer");
    container.innerHTML = "";

    items.forEach((item, index) => {
        let div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
            <span>${item.name} (${item.price})</span>
            <div>
                <input type="text" placeholder="Qty (eg: 1 kg)" id="qty-${index}">
                ${isAdmin ? `<button class="remove-btn" onclick="removeItem(${index})">X</button>` : ""}
            </div>
        `;
        container.appendChild(div);
    });
}

function adminLogin() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if (user === "Karuna" && pass === "12345678") {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        renderItems(true);
        alert("Admin Logged In");
    } else {
        alert("Invalid Credentials");
    }
}

function addItem() {
    let name = document.getElementById("newItemName").value;
    let price = document.getElementById("newItemPrice").value;

    if (!name || !price) {
        alert("Enter item name and price");
        return;
    }

    items.push({ name, price });
    renderItems(true);

    document.getElementById("newItemName").value = "";
    document.getElementById("newItemPrice").value = "";
}

function removeItem(index) {
    items.splice(index, 1);
    renderItems(true);
}

function sendOrder() {
    let message = "Hello, I want to order:\n\n";
    let hasItems = false;

    items.forEach((item, index) => {
        let qty = document.getElementById(`qty-${index}`).value;
        if (qty) {
            message += `${item.name} (${item.price}) - ${qty}\n`;
            hasItems = true;
        }
    });

    if (!hasItems) {
        alert("Please enter at least one item quantity");
        return;
    }

    let phone = "919500122469"; // change shop number
    let url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    window.open(url, "_blank");
}

// Initial render for customers
renderItems(false);
</script>

</body>
</html>
